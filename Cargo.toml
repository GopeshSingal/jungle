[package]
name = "jungle-wt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "git worktree management on your machine"
license = "MIT"
repository = "https://github.com/GopeshSingal/jungle"

[[bin]]
name = "jungle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = {
    version = "4",
    features = ["derive"]
}
rayon = "1"
rusqlite = {
    version = "0.32",
    features = ["bundled"]
}
serde = {
    version = "1",
    features = ["derive"]
}
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
