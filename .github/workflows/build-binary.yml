name: build-binary
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0 or nightly)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --locked
      - name: package
        run: |
          ARCHIVE="jungle-${{ inputs.tag }}-aarch64-apple-darwin.tar.gz"
          tar -czf "$ARCHIVE" -C target/release jungle
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - name: move nightly tag
        if: inputs.tag == 'nightly'
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          generate_release_notes: true
